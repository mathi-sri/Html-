<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>SWAP NUMBER</title>
    <style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
    font-size:16px;
    border:2px solid #ccc;
    border-radius:5px;
}

button{
    width:95%;
    padding:10px;
    background:blue;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:darkblue;
}

#result{
    margin-top:20px;
    font-size:20px;
    color:green;
    font-weight:bold;
}
</style>
</head>
<body>
    <div class="container">
        <h2>SWAP NUMBER</h2>
        <input type="number" id="num1" placeholder="enter a number">
        <input type="number" id="num2" placeholder="enter a number">
        <button onclick="swapnumber()">swap</button>
        <p id="result"></p>
    </div>
    <script>
        function swapnumber(){
            let num1 = Number(document.getElementById("num1").value);
            let num2 = Number(document.getElementById("num2").value);
            num1=num1+num2;
            num2=num1-num2;
            num1=num1-num2;
            document.getElementById("result").innerHTML= num1 + "<br>"+ num2;
        }
    </script>
</body>
</html>
