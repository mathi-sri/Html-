<!DOCTYPE html>
<html>
<head>
<title>Round Number</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: #ffffff;
    padding: 30px;
    width: 350px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    text-align: center;
}

h2 {
    color: #333;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 2px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    margin-bottom: 15px;
}

input:focus {
    outline: none;
    border-color: #007BFF;
}

button {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    background: #007BFF;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0056b3;
}

#result {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
    color: #28a745;
}
</style>

</head>

<body>

<div class="container">

<h2>Round Number</h2>

<input type="number" id="num" placeholder="enter a number in decimal">

<button onclick="roundNumber()">Round</button>

<p id="result"></p>

</div>

<script>

function roundNumber(){

    let num = Number(document.getElementById("num").value)

    let answer = Math.round(num);

    document.getElementById("result").innerHTML =
    "Rounded Number = " + answer;

}

</script>

</body>
</html>
