<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>PRINT THE NUMBER</title>
      <style>
        body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    color:#333;
    margin-bottom:20px;
}

input{
    width:90%;
    padding:10px;
    font-size:16px;
    border:2px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
}

input:focus{
    outline:none;
    border-color:#007bff;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 20px;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
    transform:scale(1.05);
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    color:#333;
}
</style>
</head>
<body>
    <div class="container">
        <h2>DISPLAY NUMBER</h2>
        <input type="number" id="num" placeholder="enternumber">
        <button onclick="ADDNUMBER()">add</button>
        <P id="result"></P>
    </div>
    <script>
            let output ="";
        function ADDNUMBER(){
            let num=Number(document.getElementById("num").value);
            if (num==0){
                return;
                
            }
            output+=num ;
            document.getElementById("result").innerHTML="Number enteres:<br> "+ output ;
            document.getElementById("num").value="";
        }

    </script>
</body>
</html>
