<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>3 AND 7 DIVISABLE NUMBERS</title>
       <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;  
            height:100vh;
        }

        .container{
            width:350px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            text-align:center;
        }

        h2{
            color:#333;
            margin-bottom:20px;
        }

        button{
            background:#007bff;
            color:white;
            border:none;
            padding:10px 20px;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#0056b3;
            transform:scale(1.05);
        }

        #result{
            margin-top:20px;
            font-size:20px;
            font-weight:bold;
            color:green;
            line-height:1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Numbers Divisible by 3 and 7</h2>
        <button onclick="printnumber()">printnumber</button>
        <p id="result"></p>
    </div>
    <script>
        function printnumber()
        {
            let output="";
            for(let i=1;i<100;i++)
            if(i%3==0&&i%7==0){
                output+=i + "<br>";
            }
            document.getElementById("result").innerHTML= output;
        }

    </script>
</body>
</html>
