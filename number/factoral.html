<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>FACTORIAL</title>
</head>

   <style>
        body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    color:#333;
    margin-bottom:20px;
}

input{
    width:90%;
    padding:10px;
    font-size:16px;
    border:2px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
}

input:focus{
    outline:none;
    border-color:#007bff;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 20px;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
    transform:scale(1.05);
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    color:#333;
}
</style>
<body>
    <div class="container">
        <h2>FACTORIAL</h2>
        <input type="number" id="num" placeholder="enter a number">
        <button onclick="factorial()">FACTORIAL</button>
        <P id="result"></P>
    </div>
    <script>
        function factorial(){
            let n = Number(document.getElementById("num").value);
        let fac =1;
            for(let i=1;i<=n;i++){
                fac=fac*i;
                document.getElementById("result").innerHTML="factorial of " + n + " = "+ fac;
            }
            
        }
    </script>
    
</body>
</html>
