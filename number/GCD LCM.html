<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>GCD AND LCM</title>
    
   <style>
        body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    color:#333;
    margin-bottom:20px;
}

input,select{
    width:90%;
    padding:10px;
    font-size:16px;
    border:2px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
}

input:focus{
    outline:none;
    border-color:#007bff;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 20px;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
    transform:scale(1.05);
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    color:#333;
}
</style>
</head>
<body>
    <div class="container">
        <h2>GCD</h2>
        <input type="number" id="num1" placeholder="enter a number">
        <input type="number" id="num2" placeholder="enter a number">
        <select  id="choice">
            <option value="1">Find GCD</option>
            <option value="2">Find LCM</option>
        </select>
        <button onclick="Calculate()">Calculate</button>
        <p id="result"></p>
    </div>

        <script>
            function Calculate(){
                 let a= Number(document.getElementById("num1").value);
            let b= Number(document.getElementById("num2").value);
            let x=a;
            let y=b;
            while(y!=0){
                let temp=y;
                y=x%y;
                x=temp;
            }
            let gcd = x;
            let choice =document.getElementById("choice").value;
            switch(choice){
                case "1":
                document.getElementById("result").innerHTML="GCD= "+ gcd;
                break;
                case "2":
                    let lcm=(a*b)/gcd;
                    document.getElementById("result").innerHTML="LCM= "+ lcm;
                    break;
                default:
                    document.getElementById("result").innerHTML="INVALID CHOICE";
            }
            }
            
        </script>
    
</body>
</html>
