<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
       <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:white;
            padding:20px;
            text-align:center;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            color:#333;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
            font-size:16px;
            border:2px solid #ccc;
            border-radius:5px;
        }

        button{
            width:95%;
            padding:10px;
            background:blue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:darkblue;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            color:green;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Compare Two Dates</h2>

    <input type="date" id="date1">

    <input type="date" id="date2">

    <button onclick="compareDates()">Compare Dates</button>

    <p id="result"></p>

</div>
<script>
    function compareDates(){
        let date1=new Date(document.getElementById("date1").value);
        let date2=new Date(document.getElementById("date2").value);
        let difference=Math.abs(date2.getTime()-date1.getTime());
        let days =difference/(1000*60*60*24);
        document.getElementById("result").innerHTML=("Difference = " + days + "day(s)");
    }
</script>
    
</body>
</html>
