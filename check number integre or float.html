<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>check number integre or float</title>
      <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:350px;
            background:white;
            padding:20px;
            text-align:center;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            color:#333;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
            font-size:16px;
            border:2px solid #ccc;
            border-radius:5px;
        }

        button{
            width:95%;
            padding:10px;
            background:blue;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:darkblue;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            font-weight:bold;
            color:green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Check integre or float </h2>
        <input type="number" id="num" placeholder="enter a number">
        <button onclick="checknumber()">check</button>
        <p id="result"></p>
    </div>
    <script>
        function checknumber(){
            let num = Number(document.getElementById("num").value);
            if(Number.isInteger(num)){
                document.getElementById("result").innerHTML= num + " is an integer"
            }
            else{
                document.getElementById("result").innerHTML= num + " is a float"
            }
        }
    </script>
</body>
</html>
