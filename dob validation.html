<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DOB Validation</title>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:350px;
            background:white;
            padding:20px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px gray;
        }

        h2{
            color:#333;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
            font-size:16px;
            border:2px solid #ccc;
            border-radius:5px;
        }

        button{
            width:95%;
            padding:10px;
            background:blue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:darkblue;
        }

        #result{
            margin-top:20px;
            font-size:20px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>DOB Validation</h2>

    <input type="date" id="dob">

    <button onclick="checkAge()">Check Age</button>

    <p id="result"></p>

</div>

<script>

function checkAge(){

    let dob = new Date(document.getElementById("dob").value);

    let today = new Date();

    let age = today.getFullYear() - dob.getFullYear();

    let month = today.getMonth() - dob.getMonth();

    
    if(month < 0 || (month == 0 && today.getDate() < dob.getDate())){
        age--;
    }

    if(age >= 18 && age <= 30){
        document.getElementById("result").innerHTML =
        "Valid (Age = " + age + ")";
        document.getElementById("result").style.color = "green";
    }
    else{
        document.getElementById("result").innerHTML =
        "Invalid (Age = " + age + ")";
        document.getElementById("result").style.color = "red";
    }

}

</script>

</body>
</html>
