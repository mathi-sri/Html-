<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Reverse a String</title>
    <style>
    body{
    font-family:Arial;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:white;
    padding:20px;
    width:350px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}
input,button{
    padding:10px;
    width:90%;
    margin:10px;
}
button{
    background:blue;
    color:white;
    border:none;
}
#result{
    color:green;
    font-size:20px;
}
</style>
</head>
<body>
    <div class="box">
        <h2>Reverse a String</h2>
        <input type="text" id="text" placeholder="enter a name">
        <button onclick="reverse()">REVERSE</button>
        <h3 id="result"></h3>
    </div>
    <script>
        function reverse(){
            let str = document.getElementById("text").value;
            let rev=str.split("").reverse().join("");
            document.getElementById("result").innerHTML=rev;
        }
    </script>
</body>
</html>
