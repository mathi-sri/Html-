<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>check anagarm</title>
    <style>
        body{
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
    text-align:center;
}

h2{
    color:#333;
    margin-bottom:20px;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
    font-size:16px;
    border:2px solid #ccc;
    border-radius:5px;
}

input:focus{
    outline:none;
    border-color:#007bff;
}

button{
    width:95%;
    padding:10px;
    margin-top:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
    </style>
</head>
<body>
    <div class="container">
        <h2>check the anagram</h2>
        <input type="text" id="text1" placeholder="enter a sentence">
        <input type=" text" id="text2" placeholder="enter a sentence">
        <button onclick="checkanagarm()">check anagarm</button>
        <p id="result"></p>
    </div>
    <script>
        function checkanagarm(){
            let str1=document.getElementById("text1").value;
            let str2=document.getElementById("text2").value;
            if(str1.length!=str2.length){
                document.getElementById("result").innerHTML="not anagarm";
                return;
            }
            for(let i=0;i<str1.length;i++)
            {
                let ch=str1.charAt(i);
                let count1=0;
                let count2=0;
                for(let j=0;j<str1.length;j++)
            {
                if(str1[j]==ch){
                    count1++;
                }
                if(str2[j]==ch){
                    count2++;
                }
                
            }
            if(count1!=count2){
                document.getElementById("result").innerHTML="not anagram";
            }
            else{
               document.getElementById("result").innerHTML="anagram"; 
            }
            }

        }
    </script>
</body>
</html>
