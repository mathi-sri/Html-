<!DOCTYPE html>
<html>
<head>
    <title>Fixed Decimal</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:350px;
            background:white;
            padding:20px;
            text-align:center;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        button{
            width:90%;
            padding:10px;
            background:blue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        #result{
            margin-top:20px;
            color:green;
            font-size:22px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Fixed Decimal</h2>

<button onclick="showNumber()">Show</button>

<p id="result"></p>

</div>

<script>

function showNumber()
{
    let num = 12.56789;
    let answer = num.toFixed(2);
    document.getElementById("result").innerHTML = answer;

}

</script>

</body>
</html>
